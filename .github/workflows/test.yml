name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The image pins Bun and ships util-linux flock, the same environment as a local Docker run.
      - run: docker compose -f docker-compose.test.yml run --rm --build engine-test
