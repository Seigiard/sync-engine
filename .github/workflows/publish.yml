name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify package
        run: node scripts/verify-pack.ts "$RUNNER_TEMP/verified-package"
      - name: Check in Linux
        run: docker compose -f docker-compose.test.yml run --rm --build engine-test

  publish:
    needs: check
    if: github.repository == 'Seigiard/sync-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      # Repack from the tested commit; nothing installed or generated by the check job enters this runner.
      - name: Verify release archive
        run: |
          node scripts/verify-pack.ts "$RUNNER_TEMP/release-package" > "$RUNNER_TEMP/package-report.json"
          cat "$RUNNER_TEMP/package-report.json"
          {
            echo '## Verified package'
            echo '```json'
            cat "$RUNNER_TEMP/package-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage verified archive
        run: |
          archive="$(node -p "require(process.env.RUNNER_TEMP + '/package-report.json').archive")"
          npm stage publish "$archive" --ignore-scripts --access public --registry https://registry.npmjs.org
